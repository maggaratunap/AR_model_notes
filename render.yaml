# Render Blueprint. In Render: New > Blueprint, then pick this repo.
services:
  - type: web
    name: ar-model-notes
    runtime: node
    plan: free            # change to "starter" (or higher) to use the persistent disk below
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_UPLOAD_MB
        value: "150"
    # Uncomment on a paid plan so uploaded models and notes survive restarts and redeploys.
    # On the free plan the filesystem is wiped whenever the service restarts or sleeps.
    # Also add this under envVars:  - key: DATA_DIR / value: /var/data
    # disk:
    #   name: model-notes-data
    #   mountPath: /var/data
    #   sizeGB: 5
